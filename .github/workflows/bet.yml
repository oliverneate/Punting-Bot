name: betting-bot

on:
  schedule:
    # UTC. 09:17 UTC = ~6:47pm Darwin: catches European evening games, US games
    # the next morning and Australian games the next day. If you change how often
    # this runs, change budget.runs_per_day in config.yaml to match.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: run = scan and bet, backtest = historical test
        default: run
        type: choice
        options: [run, backtest]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: betting-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run.py ${{ inputs.command || 'run' }}

      - name: Save state back to the repo
        if: always()
        run: |
          git config user.name "betting-bot"
          git config user.email "betting-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "bot: ${{ inputs.command || 'run' }}"
          git pull --rebase && git push

      - uses: actions/upload-pages-artifact@v3
        if: always()
        continue-on-error: true
        with:
          path: site
      - id: deploy
        if: always()
        continue-on-error: true
        uses: actions/deploy-pages@v4
